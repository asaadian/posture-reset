name: posture_reset
description: "Desk Workout - quick desk stretches, posture recovery, and short guided mobility sessions."
publish_to: 'none'
version: 1.5.1+7

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  cupertino_icons: ^1.0.8
  go_router: ^17.2.0
  flutter_riverpod: ^3.3.1
  google_fonts: ^8.0.2
  supabase_flutter: ^2.12.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  in_app_purchase: ^3.2.3
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  package_info_plus: ^8.3.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/desk_workout_icon.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/desk_workout_icon.png
    - assets/images/body_map/front.png
    - assets/images/body_map/back.png
    - assets/images/sessions/
    - assets/images/premium_recovery_loop.gif
    - assets/images/programs/
    - assets/images/filters/
    - assets/images/app_loading.webp